<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page">
        <h1>Weather Dashboard</h1>

        <form id="search-form" class="search-form">
            <input
                type="text"
                id="city-input"
                placeholder="Search for a city..."
                autocomplete="off"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="loading-message" class="loading-message hidden">Loading weather data...</p>
        <p id="error-message" class="error-message hidden"></p>

        <section id="weather-result" class="weather-card hidden">
            <div class="weather-summary">
                <h2 id="location"></h2>
                <p id="local-time"></p>
                <img id="weather-icon" class="weather-icon" src="" alt="">
                <p id="temperature" class="temperature"></p>
                <p id="feels-like"></p>
                <p id="condition"></p>
            </div>

            <dl class="weather-details">
                <div class="detail"><dt>Humidity</dt><dd id="humidity"></dd></div>
                <div class="detail"><dt>Wind</dt><dd id="wind"></dd></div>
                <div class="detail"><dt>Pressure</dt><dd id="pressure"></dd></div>
                <div class="detail"><dt>Visibility</dt><dd id="visibility"></dd></div>
                <div class="detail"><dt>Sunrise</dt><dd id="sunrise"></dd></div>
                <div class="detail"><dt>Sunset</dt><dd id="sunset"></dd></div>
            </dl>
        </section>

        <section id="forecast" class="forecast hidden">
            <h2>5-Day Forecast</h2>
            <div id="forecast-cards" class="forecast-cards"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
